openapi: 3.0.3
info:
  title: FitHub API
  version: 1.0.0
  description: |
    REST API for the FitHub Android app (PROG7314 Final POE).

    **Design rules**
    - Identity is a Firebase ID token (`Authorization: Bearer <token>`). The user id always comes from the
      verified token, never from the URL or body, so one user can never address another user's data.
    - Writes are idempotent upserts (`PUT /resource/{id}`) with a client-generated id. This lets the app
      retry safely and replay an offline outbox without creating duplicates.
    - Conflict rule is last-write-wins on `updatedAt`. A stale write is not applied; the stored document is
      returned with the header `X-Applied: false`.
    - Missing nutrition values are `null`, never `0`. `0` means "known to be zero".
    - Calculations (calories, macros, goal direction, daily totals, rewards) are done on the server.
    - Errors use one shape: `{ "error": { "code", "message", "details?", "requestId" } }`.
servers:
  - url: https://fithub-api.onrender.com
    description: Production (Render). Replace with the real service URL after deploy.
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Profile
  - name: Body
  - name: Nutrition
  - name: Workouts
  - name: Rewards
paths:
  /health:
    get:
      tags: [System]
      summary: Liveness check (no auth)
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required: [status, time]
                properties:
                  status: { type: string, example: ok }
                  time: { type: string, format: date-time }
  /api/v1/me:
    get:
      tags: [Profile]
      summary: Get the signed-in user's profile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Profile]
      summary: Create or update the signed-in user's profile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ProfileInput' } } }
      responses:
        '200': { description: Stored profile, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Profile' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me/onboarding:
    post:
      tags: [Profile]
      summary: Complete onboarding in one call
      description: |
        Creates the profile, the starting weight entry, the weight goal (direction derived on the server),
        nutrition goals (calories, macros and meal split calculated on the server), default workout goals and the
        default weigh-in schedule in one transaction. `targetWeightKg` is optional; when it is left out the goal
        is to maintain the current weight. Calling it again for the same user returns the existing result
        (idempotent).
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingInput' } } }
      responses:
        '200': { description: Everything created for the user, content: { application/json: { schema: { $ref: '#/components/schemas/OnboardingResult' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/weight-entries:
    get:
      tags: [Body]
      summary: List weight entries (newest first)
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { $ref: '#/components/schemas/WeightEntryList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/weight-entries/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Body]
      summary: Upsert a weight entry (also refreshes the profile's current weight)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WeightEntryInput' } } } }
      responses:
        '200': { description: Stored entry, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WeightEntry' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Body]
      summary: Delete a weight entry
      responses:
        '204': { description: Deleted (or already absent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/goals/current:
    get:
      tags: [Body]
      summary: Current weight goal
      responses:
        '200': { description: Goal, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/goals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Body]
      summary: Upsert a weight goal (direction is derived by the server)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GoalInput' } } } }
      responses:
        '200': { description: Stored goal, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Goal' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/checkpoint-schedule:
    get:
      tags: [Body]
      summary: Weigh-in schedule
      responses:
        '200': { description: Schedule, content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointSchedule' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Body]
      summary: Upsert the weigh-in schedule (one per user)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointScheduleInput' } } } }
      responses:
        '200': { description: Stored schedule, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/CheckpointSchedule' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nutrition-goals/recommendation:
    get:
      tags: [Nutrition]
      summary: Calculate recommended calories, macros and meal split
      description: Uses Mifflin-St Jeor from the stored profile and weight goal. Nothing is saved.
      responses:
        '200': { description: Recommendation, content: { application/json: { schema: { $ref: '#/components/schemas/Recommendation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/nutrition-goals/current:
    get:
      tags: [Nutrition]
      summary: Current nutrition goals
      responses:
        '200': { description: Goals, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionGoals' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/nutrition-goals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Nutrition]
      summary: Upsert nutrition goals (meal targets must add up to userDailyCalories)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionGoalsInput' } } } }
      responses:
        '200': { description: Stored goals, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/NutritionGoals' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-goals/current:
    get:
      tags: [Workouts]
      summary: Current workout goals
      responses:
        '200': { description: Goals, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutGoals' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workout-goals/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Workouts]
      summary: Upsert workout goals
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutGoalsInput' } } } }
      responses:
        '200': { description: Stored goals, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutGoals' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/food-logs:
    get:
      tags: [Nutrition]
      summary: List food logs for a day or a range
      parameters:
        - { name: date, in: query, schema: { type: string, format: date }, description: One day. Takes priority over from/to. }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { description: Logs, content: { application/json: { schema: { $ref: '#/components/schemas/FoodLogList' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/food-logs/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Nutrition]
      summary: Upsert a food log (null nutrition means unavailable, not zero)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/FoodLogInput' } } } }
      responses:
        '200': { description: Stored log, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/FoodLog' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Nutrition]
      summary: Delete a food log
      responses:
        '204': { description: Deleted (or already absent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/nutrition/summary:
    get:
      tags: [Nutrition]
      summary: Daily totals, remaining calories and per-meal progress (calculated on the server)
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/DailySummary' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/exercises:
    get:
      tags: [Workouts]
      summary: Exercise catalogue (read-only, served from the server)
      responses:
        '200': { description: Exercises, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Exercise' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-plans:
    get:
      tags: [Workouts]
      summary: The user's own and saved workout plans
      responses:
        '200': { description: Plans, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-plans/verified:
    get:
      tags: [Workouts]
      summary: Verified library plans shipped with FitHub
      responses:
        '200': { description: Plans, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-plans/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Workouts]
      summary: Upsert a user plan (activity and duration are recalculated by the server)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlanInput' } } } }
      responses:
        '200': { description: Stored plan, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutPlan' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Workouts]
      summary: Delete a user plan
      responses:
        '204': { description: Deleted (or already absent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-sessions:
    get:
      tags: [Workouts]
      summary: List workout sessions (newest first)
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200': { description: Sessions, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutSessionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/workout-sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    put:
      tags: [Workouts]
      summary: Upsert a workout session
      description: |
        `exercises[].reps` and `durationSeconds` are the amounts actually completed. The server recalculates
        kcal from the exercise catalogue and the totals. A session saved as `COMPLETED` for the first time
        awards particles exactly once (replays never award twice).
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutSessionInput' } } } }
      responses:
        '200': { description: Stored session, headers: { X-Applied: { $ref: '#/components/headers/XApplied' } }, content: { application/json: { schema: { $ref: '#/components/schemas/WorkoutSession' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Workouts]
      summary: Delete a workout session
      responses:
        '204': { description: Deleted (or already absent) }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/rewards:
    get:
      tags: [Rewards]
      summary: Particle wallet, level and reward offers with per-user status
      responses:
        '200': { description: Rewards, content: { application/json: { schema: { $ref: '#/components/schemas/RewardsOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/rewards/{offerId}/claim:
    post:
      tags: [Rewards]
      summary: Claim a reward (per user, atomic, idempotent)
      description: Deducts the cost and records the claim in one transaction. Claiming twice returns 409.
      parameters: [{ name: offerId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Claim recorded, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already claimed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Not enough particles, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/achievements:
    get:
      tags: [Rewards]
      summary: Achievements with the user's progress (progress is calculated from stored data)
      responses:
        '200': { description: Achievements, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/Achievement' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/achievements/{id}/claim:
    post:
      tags: [Rewards]
      summary: Claim an unlocked achievement's particles (atomic, once per user)
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Claimed, content: { application/json: { schema: { $ref: '#/components/schemas/ClaimResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already claimed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: Not unlocked yet, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: Firebase ID token }
  headers:
    XApplied:
      description: '`false` when the write was older than the stored data and was ignored (last-write-wins).'
      schema: { type: string, enum: ['true', 'false'] }
  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 'Client-generated id (UUID recommended). Letters, digits and the characters _ - : . only, max 128.'
      schema: { type: string, pattern: '^[A-Za-z0-9_:.-]{1,128}$' }
    From: { name: from, in: query, schema: { type: string, format: date }, description: Inclusive start date. }
    To: { name: to, in: query, schema: { type: string, format: date }, description: Inclusive end date. }
  responses:
    Unauthorized: { description: Missing, malformed or expired token, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ValidationError: { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string }
            details: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
            requestId: { type: string }
    Gender: { type: string, enum: [MALE, FEMALE, OTHER] }
    ActivityLevel: { type: string, enum: [SEDENTARY, LIGHTLY_ACTIVE, MODERATELY_ACTIVE, VERY_ACTIVE, EXTREMELY_ACTIVE] }
    GoalDirection: { type: string, enum: [LOSE, MAINTAIN, GAIN] }
    MealType: { type: string, enum: [BREAKFAST, LUNCH, DINNER, SNACK] }
    Timestamp: { type: string, format: date-time, description: ISO-8601. Used for last-write-wins. }
    ProfileInput:
      type: object
      required: [firstName, gender, age, heightCm, activityLevel, updatedAt]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50, description: Not blank after trimming. }
        surname: { type: string, maxLength: 50 }
        email: { type: string, format: email }
        gender: { $ref: '#/components/schemas/Gender' }
        age: { type: integer, minimum: 1, maximum: 120 }
        heightCm: { type: number, minimum: 80, maximum: 250 }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }
        profileImageUrl: { type: string, nullable: true }
        biometricEnabled: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Profile:
      allOf:
        - $ref: '#/components/schemas/ProfileInput'
        - type: object
          required: [id, startingWeightKg, currentWeightKg, onboardingComplete, createdAt]
          properties:
            id: { type: string, description: Firebase UID }
            startingWeightKg: { type: number }
            currentWeightKg: { type: number }
            onboardingComplete: { type: boolean }
            createdAt: { $ref: '#/components/schemas/Timestamp' }
    OnboardingInput:
      type: object
      required: [firstName, gender, age, heightCm, weightKg, activityLevel]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        surname: { type: string, maxLength: 50 }
        email: { type: string, format: email }
        gender: { $ref: '#/components/schemas/Gender' }
        age: { type: integer, minimum: 1, maximum: 120 }
        heightCm: { type: number, minimum: 80, maximum: 250 }
        weightKg: { type: number, minimum: 20, maximum: 400 }
        targetWeightKg: { type: number, minimum: 20, maximum: 400, nullable: true }
        activityLevel: { $ref: '#/components/schemas/ActivityLevel' }
        biometricEnabled: { type: boolean }
        localDate: { type: string, format: date, description: The phone's local date, used for dated records. Defaults to the server's UTC date. }
    OnboardingResult:
      type: object
      required: [profile, weightEntry, goal, nutritionGoals, workoutGoals, checkpointSchedule, recommendation]
      properties:
        profile: { $ref: '#/components/schemas/Profile' }
        weightEntry: { $ref: '#/components/schemas/WeightEntry' }
        goal: { $ref: '#/components/schemas/Goal' }
        nutritionGoals: { $ref: '#/components/schemas/NutritionGoals' }
        workoutGoals: { $ref: '#/components/schemas/WorkoutGoals' }
        checkpointSchedule: { $ref: '#/components/schemas/CheckpointSchedule' }
        recommendation: { $ref: '#/components/schemas/Recommendation' }
    WeightEntryInput:
      type: object
      required: [weightKg, date, updatedAt]
      properties:
        weightKg: { type: number, minimum: 20, maximum: 400 }
        date: { type: string, format: date }
        note: { type: string, maxLength: 200, nullable: true }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WeightEntry:
      allOf:
        - $ref: '#/components/schemas/WeightEntryInput'
        - { type: object, required: [id], properties: { id: { type: string } } }
    WeightEntryList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WeightEntry' } } } }
    GoalInput:
      type: object
      required: [targetWeightKg, effectiveDate, updatedAt]
      properties:
        targetWeightKg: { type: number, minimum: 20, maximum: 400 }
        effectiveDate: { type: string, format: date }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    Goal:
      allOf:
        - $ref: '#/components/schemas/GoalInput'
        - type: object
          required: [id, currentWeightKgAtGoalSet, direction]
          properties:
            id: { type: string }
            currentWeightKgAtGoalSet: { type: number, description: Set by the server from the profile. }
            direction: { $ref: '#/components/schemas/GoalDirection' }
    CheckpointScheduleInput:
      type: object
      required: [frequencyDays, nextCheckpointDate, remindersEnabled, updatedAt]
      properties:
        frequencyDays: { type: integer, minimum: 1, maximum: 90 }
        nextCheckpointDate: { type: string, format: date }
        remindersEnabled: { type: boolean }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    CheckpointSchedule:
      allOf:
        - $ref: '#/components/schemas/CheckpointScheduleInput'
        - { type: object, required: [id], properties: { id: { type: string } } }
    MealTargets:
      type: object
      required: [breakfastKcal, lunchKcal, dinnerKcal, snackKcal]
      properties:
        breakfastKcal: { type: integer, minimum: 0, maximum: 10000 }
        lunchKcal: { type: integer, minimum: 0, maximum: 10000 }
        dinnerKcal: { type: integer, minimum: 0, maximum: 10000 }
        snackKcal: { type: integer, minimum: 0, maximum: 10000 }
    MacroTargets:
      type: object
      required: [proteinG, carbsG, fatG]
      properties:
        proteinG: { type: integer, minimum: 0, maximum: 2000 }
        carbsG: { type: integer, minimum: 0, maximum: 2000 }
        fatG: { type: integer, minimum: 0, maximum: 2000 }
    Recommendation:
      type: object
      required: [bmrKcal, tdeeKcal, recommendedDailyCalories, goalAdjustmentApplied, direction, macroTargets, mealTargets]
      properties:
        bmrKcal: { type: number }
        tdeeKcal: { type: number }
        recommendedDailyCalories: { type: integer }
        goalAdjustmentApplied: { type: integer }
        direction: { $ref: '#/components/schemas/GoalDirection' }
        macroTargets: { $ref: '#/components/schemas/MacroTargets' }
        mealTargets: { $ref: '#/components/schemas/MealTargets' }
    NutritionGoalsInput:
      type: object
      required: [userDailyCalories, mealTargets, macroTargets, effectiveDate, updatedAt]
      properties:
        userDailyCalories: { type: integer, minimum: 1000, maximum: 10000 }
        mealTargets: { $ref: '#/components/schemas/MealTargets' }
        macroTargets: { $ref: '#/components/schemas/MacroTargets' }
        effectiveDate: { type: string, format: date }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    NutritionGoals:
      allOf:
        - $ref: '#/components/schemas/NutritionGoalsInput'
        - type: object
          required: [id, recommendedDailyCalories]
          properties:
            id: { type: string }
            recommendedDailyCalories: { type: integer, description: Set by the server; clients cannot change it. }
    WorkoutGoalsInput:
      type: object
      required: [sessionsPerWeek, monthlyActivityGoalKcal, updatedAt]
      properties:
        sessionsPerWeek: { type: integer, minimum: 1, maximum: 14 }
        monthlyActivityGoalKcal: { type: integer, minimum: 0, maximum: 100000 }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkoutGoals:
      allOf:
        - $ref: '#/components/schemas/WorkoutGoalsInput'
        - { type: object, required: [id], properties: { id: { type: string } } }
    FoodLogInput:
      type: object
      required: [foodName, mealType, source, portionSize, portionUnit, portionGrams, logDate, loggedAt, updatedAt]
      properties:
        foodId: { type: string, nullable: true }
        foodName: { type: string, minLength: 1, maxLength: 120 }
        brandName: { type: string, maxLength: 120, nullable: true }
        imageUrl: { type: string, nullable: true }
        mealType: { $ref: '#/components/schemas/MealType' }
        source: { type: string, enum: [BARCODE, SEARCH, AI_RECOGNITION, MANUAL] }
        barcode: { type: string, maxLength: 32, nullable: true }
        portionSize: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 100 }
        portionUnit: { type: string, maxLength: 20 }
        portionGrams: { type: number, minimum: 0, maximum: 20000 }
        calories: { type: number, minimum: 0, maximum: 20000, nullable: true, description: 'null = unavailable (not the same as 0).' }
        proteinG: { type: number, minimum: 0, maximum: 2000, nullable: true }
        carbsG: { type: number, minimum: 0, maximum: 2000, nullable: true }
        fatG: { type: number, minimum: 0, maximum: 2000, nullable: true }
        logDate: { type: string, format: date }
        loggedAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    FoodLog:
      allOf:
        - $ref: '#/components/schemas/FoodLogInput'
        - { type: object, required: [id], properties: { id: { type: string } } }
    FoodLogList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/FoodLog' } } } }
    Totals:
      type: object
      required: [calories, proteinG, carbsG, fatG]
      properties:
        calories: { type: number }
        proteinG: { type: number }
        carbsG: { type: number }
        fatG: { type: number }
    DailySummary:
      type: object
      required: [date, totals, targetCalories, remainingCalories, entriesWithUnknownNutrition, meals]
      properties:
        date: { type: string, format: date }
        totals: { $ref: '#/components/schemas/Totals' }
        targetCalories: { type: integer, nullable: true }
        remainingCalories: { type: number, nullable: true }
        entriesWithUnknownNutrition: { type: integer, description: Entries whose calories were unavailable and are therefore not in the totals. }
        meals:
          type: array
          items:
            type: object
            required: [mealType, consumedCalories, targetCalories, entries]
            properties:
              mealType: { $ref: '#/components/schemas/MealType' }
              consumedCalories: { type: number }
              targetCalories: { type: integer, nullable: true }
              entries: { type: integer }
    Exercise:
      type: object
      required: [id, name, category, isTimeBased]
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string, enum: [CHEST, BACK, LEGS, ARMS, CORE, CARDIO, MOBILITY, GYM] }
        description: { type: string }
        difficulty: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        equipment: { type: string }
        isTimeBased: { type: boolean }
        estimatedActivityPerRep: { type: number }
        estimatedActivityPerSecond: { type: number }
        estimatedSecondsPerRep: { type: integer }
    WorkoutExercise:
      type: object
      required: [exerciseId, orderIndex]
      properties:
        exerciseId: { type: string }
        exerciseName: { type: string }
        category: { type: string }
        orderIndex: { type: integer, minimum: 0 }
        targetReps: { type: integer, minimum: 0, maximum: 1000 }
        targetDurationSeconds: { type: integer, minimum: 0, maximum: 14400 }
        estimatedActivityKcal: { type: number, description: Recalculated by the server. }
    WorkoutPlanInput:
      type: object
      required: [name, exercises, updatedAt]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        category: { type: string, enum: [GENERAL_FITNESS, CARDIO, STRENGTH, ENDURANCE, MOBILITY, CREATED] }
        difficulty: { type: string, enum: [BEGINNER, INTERMEDIATE, ADVANCED] }
        equipment: { type: string, maxLength: 80 }
        imageUrl: { type: string, nullable: true }
        isSaved: { type: boolean }
        exercises: { type: array, minItems: 1, maxItems: 50, items: { $ref: '#/components/schemas/WorkoutExercise' } }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkoutPlan:
      allOf:
        - $ref: '#/components/schemas/WorkoutPlanInput'
        - type: object
          required: [id, estimatedActivityKcal, estimatedDurationMinutes, isVerified]
          properties:
            id: { type: string }
            estimatedActivityKcal: { type: integer }
            estimatedDurationMinutes: { type: integer }
            isVerified: { type: boolean }
    WorkoutPlanList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkoutPlan' } } } }
    CompletedExercise:
      type: object
      required: [exerciseId]
      properties:
        exerciseId: { type: string }
        exerciseName: { type: string }
        reps: { type: integer, minimum: 0, maximum: 1000, description: Reps actually completed. }
        durationSeconds: { type: integer, minimum: 0, maximum: 14400, description: Seconds actually completed. }
        estimatedActivityKcal: { type: number, description: Recalculated by the server from the amounts above. }
    WorkoutSessionInput:
      type: object
      required: [workoutPlanId, workoutName, status, exercises, startedAt, completedAt, logDate, updatedAt]
      properties:
        workoutPlanId: { type: string }
        workoutName: { type: string, minLength: 1, maxLength: 80 }
        workoutCategory: { type: string }
        status: { type: string, enum: [COMPLETED, PARTIAL, DISCARDED] }
        exercises: { type: array, maxItems: 50, items: { $ref: '#/components/schemas/CompletedExercise' } }
        durationMinutes: { type: integer, minimum: 0, maximum: 1440 }
        startedAt: { $ref: '#/components/schemas/Timestamp' }
        completedAt: { $ref: '#/components/schemas/Timestamp' }
        logDate: { type: string, format: date }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }
    WorkoutSession:
      allOf:
        - $ref: '#/components/schemas/WorkoutSessionInput'
        - type: object
          required: [id, estimatedActivityKcal, particlesAwarded]
          properties:
            id: { type: string }
            estimatedActivityKcal: { type: integer }
            particlesAwarded: { type: integer, description: Particles credited for this session (0 unless COMPLETED). }
    WorkoutSessionList: { type: object, required: [items], properties: { items: { type: array, items: { $ref: '#/components/schemas/WorkoutSession' } } } }
    RewardOffer:
      type: object
      required: [id, title, subtitle, costParticles, status]
      properties:
        id: { type: string }
        title: { type: string }
        subtitle: { type: string }
        costParticles: { type: integer }
        status: { type: string, enum: [AVAILABLE, CLAIMED, INSUFFICIENT] }
    RewardsOverview:
      type: object
      required: [balance, lifetimeEarned, level, particlesToNextLevel, offers]
      properties:
        balance: { type: integer }
        lifetimeEarned: { type: integer }
        level: { type: integer }
        particlesToNextLevel: { type: integer }
        offers: { type: array, items: { $ref: '#/components/schemas/RewardOffer' } }
    Achievement:
      type: object
      required: [id, title, description, category, goalValue, rewardParticles, progress, isUnlocked, isClaimed]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        category: { type: string, enum: [NUTRITION, WORKOUT] }
        goalValue: { type: integer }
        rewardParticles: { type: integer }
        progress: { type: integer }
        isUnlocked: { type: boolean }
        isClaimed: { type: boolean }
    ClaimResult:
      type: object
      required: [balance, lifetimeEarned]
      properties:
        balance: { type: integer }
        lifetimeEarned: { type: integer }
        claimedId: { type: string }
